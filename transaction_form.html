{% extends 'base.html' %}
{% block title %}{{ 'Редактирование' if t.id else 'Новая операция' }}{% endblock %}
{% block heading %}{{ 'Редактирование операции' if t.id else 'Новая операция' }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card"><div class="card-body p-4">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="btn-group w-100 mb-3" role="group">
      <input type="radio" class="btn-check" name="type" id="tExp" value="expense" {% if t.type=='expense' %}checked{% endif %}>
      <label class="btn btn-outline-danger" for="tExp"><i class="bi bi-dash-circle"></i> Расход</label>
      <input type="radio" class="btn-check" name="type" id="tInc" value="income" {% if t.type=='income' %}checked{% endif %}>
      <label class="btn btn-outline-success" for="tInc"><i class="bi bi-plus-circle"></i> Доход</label>
    </div>
    <div class="mb-3"><label class="form-label">Сумма, {{ current_user.currency }}</label>
      <input name="amount" class="form-control form-control-lg" inputmode="decimal" required autofocus
             value="{{ '%.2f'|format(t.amount) if t.amount else '' }}" placeholder="0,00"></div>
    <div class="row g-3 mb-3">
      <div class="col-sm-6"><label class="form-label">Категория</label>
        <select name="category_id" id="catSelect" class="form-select" required>
          {% for c in categories %}<option value="{{ c.id }}" data-type="{{ c.type }}" {% if c.id==t.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select></div>
      <div class="col-sm-6"><label class="form-label">Счёт</label>
        <select name="account_id" class="form-select" required>
          {% for a in accounts %}<option value="{{ a.id }}" {% if a.id==t.account_id %}selected{% endif %}>{{ a.name }} ({{ a.balance()|money }})</option>{% endfor %}
        </select></div>
    </div>
    <div class="mb-3"><label class="form-label">Дата</label>
      <input type="date" name="date" class="form-control" value="{{ t.date.isoformat() }}" required></div>
    <div class="mb-4"><label class="form-label">Описание</label>
      <input name="description" class="form-control" maxlength="255" value="{{ t.description or '' }}" placeholder="Например: продукты на неделю"></div>
    <div class="d-flex gap-2"><button class="btn btn-primary flex-grow-1"><i class="bi bi-check-lg"></i> Сохранить</button>
      <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary">Отмена</a></div>
  </form>
</div></div></div></div>
{% endblock %}
{% block scripts %}
<script>
// показываем в списке только категории выбранного типа
function filterCats() {
  const type = document.querySelector('input[name=type]:checked').value;
  const sel = document.getElementById('catSelect');
  let firstVisible = null;
  [...sel.options].forEach(o => { const ok = o.dataset.type === type; o.hidden = !ok; if (ok && !firstVisible) firstVisible = o; });
  if (sel.selectedOptions[0]?.hidden && firstVisible) sel.value = firstVisible.value;
}
document.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', filterCats));
filterCats();
</script>
{% endblock %}
